name: bundle-blog

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bundle-blog.yml'
      - 'apps/blog/**'
      - 'packages/**'
      - 'package-lock.json'
      - 'package.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # Skip Husky during CI: https://typicode.github.io/husky/how-to.html#ci-server-and-docker

jobs:
  bundle-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Set up checkout
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm # https://github.com/actions/setup-node#caching-global-packages-data

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          # Static export writes to `build/`, but Next.js keeps its build cache in `.next/`.
          # The comparison action builds both refs in place, preserving this cache.
          path: apps/blog/.next/cache
          key: ${{ runner.os }}-blog-nextjs-${{ hashFiles('package-lock.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-blog-nextjs-${{ hashFiles('package-lock.json', '.nvmrc') }}-

      - name: Compare bundle sizes with main
        id: bundle
        uses: preactjs/compressed-size-action@v2
        with:
          base-ref: main
          install-script: npm ci --no-audit --no-fund --prefer-offline
          build-script: build:b
          pattern: apps/blog/build/_next/static/**/*.{js,css}
          compression: gzip
          comment-key: blog
          # Keep hash-only Turbopack filenames distinct to avoid merging unrelated chunks.

      - name: Summarize bundle sizes
        run: printf '%s\n' "$BUNDLE_SIZE_REPORT" >> "$GITHUB_STEP_SUMMARY"
        env:
          BUNDLE_SIZE_REPORT: ${{ steps.bundle.outputs.comment-body }}
