name: ci

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') }}

env:
  HUSKY: 0 # Skip Husky during CI: https://typicode.github.io/husky/how-to.html#ci-server-and-docker

jobs:
  lint:
    if: ${{ !github.event.pull_request || github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Set up checkout
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm # https://github.com/actions/setup-node#caching-global-packages-data

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build
        run: node --run build

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --run lint

  test:
    if: ${{ !github.event.pull_request || github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Set up checkout
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm # https://github.com/actions/setup-node#caching-global-packages-data

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Install playwright browsers
        run: node --run setup:browser -- --with-deps

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          # Static export writes to `build/`, but Next.js keeps its build cache in `.next/`.
          # The comparison action builds both refs in place, preserving this cache.
          path: apps/blog/.next/cache
          key: ${{ runner.os }}-blog-nextjs-${{ hashFiles('package-lock.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-blog-nextjs-${{ hashFiles('package-lock.json', '.nvmrc') }}-

      - name: Build package
        run: node --run build:pkg

      - name: Build blog
        run: node --run build:b

      - name: Test pack
        run: node --run pack:pkg

      - name: Test types
        run: node --run test:types

      - name: Test unit
        run: node --run test:unit

      - name: Test E2E
        run: node --run test:e2e
