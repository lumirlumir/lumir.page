name: ci

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') }}

env:
  HUSKY: 0 # Skip Husky during CI: https://typicode.github.io/husky/how-to.html#ci-server-and-docker

jobs:
  lint:
    if: ${{ !github.event.pull_request || github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Set up checkout
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm # https://github.com/actions/setup-node#caching-global-packages-data

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build
        run: node --run build

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --run lint

  test:
    if: ${{ !github.event.pull_request || github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Set up checkout
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm # https://github.com/actions/setup-node#caching-global-packages-data

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Install playwright browsers
        run: node --run setup:browser -- --with-deps

      - name: Build
        run: node --run build:pkg

      - name: Test pack
        run: node --run pack:pkg

      - name: Test type, unit and browser
        run: node --run test
