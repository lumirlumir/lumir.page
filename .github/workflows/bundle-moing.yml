name: bundle-moing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '.github/workflows/bundle-moing.yml'
      - 'apps/moing/**'
      - 'packages/**'
      - 'package-lock.json'
      - 'package.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # Skip Husky during CI: https://typicode.github.io/husky/how-to.html#ci-server-and-docker

jobs:
  bundle-moing:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:
      - name: Set up checkout
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm # https://github.com/actions/setup-node#caching-global-packages-data

      - name: Compare bundle sizes with main
        id: bundle
        uses: preactjs/compressed-size-action@v2
        with:
          base-ref: main
          install-script: npm ci --no-audit --no-fund --prefer-offline
          build-script: build:m
          pattern: apps/moing/build/**/*.{js,css}
          compression: gzip
          comment-key: moing
          # Normalize Vite asset hashes.
          strip-hash: '[.-][\w-]{8}(?=\.(?:js|css)$)'
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

      - name: Summarize bundle sizes
        run: printf '%s\n' "$BUNDLE_SIZE_REPORT" >> "$GITHUB_STEP_SUMMARY"
        env:
          BUNDLE_SIZE_REPORT: ${{ steps.bundle.outputs.comment-body }}
